name: Deploy Vite App to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'project/package-lock.json'

      - name: Install Dependencies
        run: |
          cd project
          npm ci

      - name: Build Application with Vite
        run: |
          cd project
          npm run build

      - name: Setup Pages Infrastructure
        uses: actions/configure-pages@v4

      - name: Upload Compiled Static Site Assets
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy Live to GitHub Pages Site
        id: deployment
        uses: actions/deploy-pages@v4
