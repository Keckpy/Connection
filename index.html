<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Supabase Fetcher</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <button id="fetch-btn">Grab Data</button>
        <table id="data-table" class="hidden-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Item</th>
                    <th>Created At</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>
    <script src="script.js" defer></script>
</body>
</html>
